name: Daily Stock News Bot

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = KST 07:00
  workflow_dispatch:        # GitHub에서 수동 실행 버튼

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Secrets 설정 확인
        run: |
          echo "GEMINI_API_KEY 설정됨: ${{ secrets.GEMINI_API_KEY != '' }}"
          echo "NOTION_API_KEY 설정됨: ${{ secrets.NOTION_API_KEY != '' }}"
          echo "NOTION_DATABASE_ID 설정됨: ${{ secrets.NOTION_DATABASE_ID != '' }}"

      - name: 뉴스 봇 실행
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
