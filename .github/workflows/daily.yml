name: Daily Stock Analysis

on:
  schedule:
    - cron: '40 6 * * 1-5'  # 평일 15:40 KST (06:40 UTC)
  workflow_dispatch:          # 수동 실행 가능

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Korean fonts
        run: sudo apt-get install -y fonts-nanum && fc-cache -fv

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_STOCKS_ID: ${{ secrets.NOTION_DB_STOCKS_ID }}
          NOTION_DB_APPEARANCES_ID: ${{ secrets.NOTION_DB_APPEARANCES_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        run: python -m src.main
